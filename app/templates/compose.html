{% extends "base.html" %}
{% block title %}Compose{% endblock %}
{% block content %}
<div class="page-header"><h1>Compose Message</h1></div>

<div class="card" style="max-width:600px;">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="idempotency_key" value="{{ new_key or '' }}">

        <div class="form-group">
            <label for="department">Recipient Department</label>
            <select id="department" name="department" class="form-control" required>
                <option value="">Select department...</option>
                {% for d in departments %}
                <option value="{{ d }}">{{ d }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" class="form-control" maxlength="200" required>
        </div>

        <div class="form-group">
            <label for="body">Message</label>
            <textarea id="body" name="body" class="form-control" maxlength="5000" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
</div>
{% endblock %}
